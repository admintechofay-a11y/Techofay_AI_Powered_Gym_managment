name: GymOS Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Build & Deploy Backend API (Docker Host)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/gymos-api:latest,ghcr.io/${{ github.repository }}/gymos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Remote Deployment via Webhook / SSH
        run: |
          echo "API image published to GHCR. Triggering zero-downtime rolling update on Docker host..."
          # Deploy command or webhook payload would trigger docker compose pull && docker compose up -d

  deploy-web:
    name: Build & Deploy Frontend (Vercel / Netlify / Nginx)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Assets
        run: |
          pnpm --filter @gymos/shared build
          pnpm --filter @gymos/web build

      - name: Deploy Static Web Assets
        run: |
          echo "Dist files generated at apps/web/dist ready for Vercel/Netlify/S3/Nginx distribution."
