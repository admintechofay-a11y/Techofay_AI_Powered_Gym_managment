services:
  mongo:
    image: mongo:7.0
    container_name: gymos-prod-mongo
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      MONGO_INITDB_DATABASE: gymos
    ports:
      - "27017:27017"
    volumes:
      - mongo-prod-data:/data/db
      - mongo-prod-config:/data/configdb
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            var status = rs.status();
            if (status.ok === 1) quit(0);
          } catch(e) {
            var res = rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
            if (res.ok === 1) quit(0);
          }
          quit(1);
        "
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - gymos-network

  redis:
    image: redis:7-alpine
    container_name: gymos-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gymos-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gymos-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/gymos?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymos-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gymos-prod-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - gymos-network

networks:
  gymos-network:
    driver: bridge

volumes:
  mongo-prod-data:
  mongo-prod-config:
  redis-prod-data:
